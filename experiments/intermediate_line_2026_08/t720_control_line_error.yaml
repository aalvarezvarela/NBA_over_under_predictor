# Control run: is pooling the six snapshots earning its complexity?
#
# NOT a deliverable. This trains on 12-hour rows ONLY, so it can serve exactly
# one betting time and is useless as a product. Its single job is to give the
# pooled model something to be measured against at the horizon that matters
# most: if the pooled model cannot beat a 12h-only model AT 12h, the pooling is
# costing more than it returns and the design should be reconsidered.
#
# T=720 is the right control because it is both the hardest case and the real
# use case. If twelve hours out works, the shorter horizons are strictly easier.
# Coverage is not the constraint: 97.6% of post-filter games have a 720-minute
# row (5,670 of 5,808) and every one carries a real quote.
#
# Build its CSV first:
#   poetry run python scripts/create_train_data/slice_intermediate_snapshot.py --snapshot 720
#
# Then run it with the ORDINARY CLI -- one row per game means the standard
# betting report is already correct, and there is nothing to group:
#   poetry run python -m training_pipeline.cli \
#       experiments/intermediate_line_2026_08/t720_control.yaml

experiment_name: intermediate_t720_control_line_error
training_version: "intermediate-line-1.0"
comparison_group: intermediate_line_2026_08
hypothesis: >
  A model trained only on 12-hour-out rows, as a control for the pooled run.
  If pooling helps, the pooled model scored at snapshot 720 should beat this;
  if it does not, the shared model is diluting the horizon rather than
  informing it.
tags: [intermediate_line, single_snapshot, control, line_error]

prediction_strategy: line_error_regressor

# Must match pooled.yaml: mixing CPU and GPU within one comparison_group adds a
# hardware confound. See pooled.yaml for how to verify the build really has
# CUDA -- a non-CUDA build warns and falls back silently rather than failing.
device: cuda

# line_col deliberately absent, exactly as in pooled.yaml -- the two runs must
# differ in one thing only, which rows they see.

data:
  csv_path: data/train_data/intermediate_line_data_20260412_t720.csv
  data_version: "20260412-intermediate-line-t720"
  # Printed by slice_intermediate_snapshot.py when it writes the file.
  expected_checksum: null
  season_year_floor: 2021
  exclude_playoffs: true
  allowed_season_types: ["Regular Season", "Play-In Tournament"]

# THE CONTROL IS CLOSE, NOT EXACT -- measured, not assumed.
# A 15,000-row window in the pooled arm holds 2,501-2,522 DISTINCT games
# (12 folds: 2522 2520 2520 2517 2514 2513 2509 2501 2501 2501 2501 2501),
# because not every game has all six snapshots: T=480 covers 5,784 games and
# T=720 covers 5,670, against 5,808 at the shorter horizons. So x6 on the row
# window lands near 2,500 games rather than on it, versus exactly 2,500 here.
#
# The gap is 0.04-0.9% of the window and is left in place deliberately: closing
# it would mean selecting a common GAME_ID cohort, and GAME_ID is dropped during
# cleaning (its name contains "_ID") for the good reason that the default
# exclude_cols would otherwise let a date-encoding string into the feature
# matrix. Worth remembering if a comparison lands inside that margin -- at which
# point the honest read is "no difference", not "the control won".

# NO window rescaling here, deliberately. This file is one row per game, so
# every *_games default in _base.yaml already means games -- and matching the
# pooled run's rescaled 15000 rows (= 2500 games) means leaving these at the
# inherited 2500. Overriding them would make the control train on a different
# amount of history than the thing it is controlling for.

optuna:
  n_trials: 50
  timeout: null

evaluation_seeds: [101, 202]
