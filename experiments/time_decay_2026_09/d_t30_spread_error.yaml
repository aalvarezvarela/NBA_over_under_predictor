  home_price_col: ODDS_SNAP_SPR_BET365_PRICE_RIGHT
  away_price_col: ODDS_SNAP_SPR_BET365_PRICE_LEFT
  comparison_line_cols: ["ODDS_CLOSING_SPREAD_LINE_HOME_bet365"]

optuna: {n_trials: 150, timeout: null}
evaluation_seeds: [17, 42]
