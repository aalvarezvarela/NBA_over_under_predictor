experiment_name: time_decay_t30_spread_error
prediction_strategy: spread_error_regressor
training_version: "2.2-time-decay"
comparison_group: time_decay_intermediate_2026_09
hypothesis: Test recency weighting for spread-error prediction 30 minutes before tip-off.
tags: [time_decay, spread_error, spread, intermediate_line, t30]

device: cuda

data:
  csv_path: data/train_data/intermediate_line_data_2_2_20260613.csv
  data_version: "20260613-intermediate-line-2.2-normalized-t30"
