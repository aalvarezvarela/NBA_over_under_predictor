  dataset_type: intermediate_line
  snapshot_minutes: 30
  scoring_csv_path: data/train_data/intermediate_line_data_2_2_20260613_scoring.csv
  season_year_floor: 2021
  extend_history_dropping_season_gated_columns: false

sample_weight:
  enabled: true
  lambda_: 0.002
  tune_lambda: true
  lambda_bounds: [0.0005, 0.005]
  allow_unweighted: true

