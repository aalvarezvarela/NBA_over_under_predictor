name: Twice-Monthly DB Backup to S3

on:
    workflow_dispatch:
    schedule:
        # 1st of every month at 08:47 UTC
        # - cron: "47 08 1 * *"
        # 15th of every month at 08:47 UTC
        - cron: "47 08 15 * *"

concurrency:
    group: monthly-db-backup
    cancel-in-progress: true

permissions:
    contents: read
    id-token: write

jobs:
    backup:
        runs-on: ubuntu-latest
        env:
            PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureWarning"
            PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

            DB_ENV: supabase
            SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
            SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
            S3_AWS_PROFILE: ""

            TZ: UTC

        steps:
            - name: Checkout
              uses: actions/checkout@v6

            - name: Set up Python
              uses: actions/setup-python@v6
              with:
                  python-version: "3.12"

            - name: Show OIDC claims
              env:
                  AUDIENCE: sts.amazonaws.com
              run: |
                  TOKEN_JSON=$(curl --fail --silent --show-error \
                    -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
                    "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=$AUDIENCE")
                  ID_TOKEN=$(echo "$TOKEN_JSON" | jq -r '.value')
                  ID_TOKEN="$ID_TOKEN" python - <<'PY'
                  import base64
                  import json
                  import os

                  payload = os.environ["ID_TOKEN"].split(".")[1]
                  payload += "=" * (-len(payload) % 4)
                  claims = json.loads(base64.urlsafe_b64decode(payload))
                  print("aud:", claims["aud"])
                  print("sub:", claims["sub"])
                  PY

            - name: Configure AWS credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@v6
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-west-1

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Backup all schemas to S3
              run: python scripts/backup_db_to_s3.py
