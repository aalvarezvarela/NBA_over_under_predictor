name: Monthly Line-History DB Backup to S3

on:
    workflow_dispatch:
        inputs:
            dry_run:
                description: "List what would be written without uploading"
                type: boolean
                default: false
    schedule:
        # 1st of every month at 05:23 UTC. Deliberately a different day from
        # the Supabase backup (15th) so the two never contend for the runner.
        - cron: "23 05 1 * *"

concurrency:
    group: monthly-line-history-backup
    cancel-in-progress: true

permissions:
    contents: read
    id-token: write

jobs:
    backup:
        runs-on: ubuntu-latest
        env:
            PYTHONWARNINGS: "ignore::UserWarning,ignore::DeprecationWarning,ignore::FutureWarning"
            PYTHONPATH: ${{ github.workspace }}:${{ github.workspace }}/src

            # The line-history store lives on Aiven, not Supabase.
            DB_ENV: aiven
            AIVEN_DB_URL: ${{ secrets.AIVEN_DB_URL }}
            AIVEN_DB_PASSWORD: ${{ secrets.AIVEN_DB_PASSWORD }}

            # Empty means "use the ambient OIDC credentials" rather than a
            # named local profile.
            S3_AWS_PROFILE: ""

            TZ: UTC

        steps:
            - name: Checkout
              uses: actions/checkout@v4

            - name: Set up Python
              uses: actions/setup-python@v5
              with:
                  python-version: "3.12"

            - name: Configure AWS credentials (OIDC)
              uses: aws-actions/configure-aws-credentials@v4
              with:
                  role-to-assume: ${{ secrets.AWS_ROLE_TO_ASSUME }}
                  aws-region: eu-west-1

            - name: Install dependencies
              run: |
                  python -m pip install --upgrade pip
                  pip install -r requirements.txt

            - name: Back up line-history schema to S3
              run: |
                  python scripts/backup_line_history_to_s3.py \
                    ${{ inputs.dry_run && '--dry-run' || '' }}

            - name: List retained backups
              if: ${{ !inputs.dry_run }}
              run: python scripts/backup_line_history_to_s3.py --list
